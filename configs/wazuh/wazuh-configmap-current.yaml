apiVersion: v1
data:
  master.conf: "<!--\r\n  Wazuh - Manager - Default configuration for ubuntu 16.04\r\n
    \ More info at: https://documentation.wazuh.com\r\n  Mailing list: https://groups.google.com/forum/#!forum/wazuh\r\n\r\n
    \ Customization: TCP on port 1514\r\n  Customization: Cluster mode enabled, master
    node\r\n-->\r\n<ossec_config>\r\n  <global>\r\n    <jsonout_output>yes</jsonout_output>\r\n
    \   <alerts_log>yes</alerts_log>\r\n    <logall>no</logall>\r\n    <logall_json>no</logall_json>\r\n
    \   <email_notification>no</email_notification>\r\n    <smtp_server>smtp.example.wazuh.com</smtp_server>\r\n
    \   <email_from>ossecm@example.wazuh.com</email_from>\r\n    <email_to>recipient@example.wazuh.com</email_to>\r\n
    \   <email_maxperhour>12</email_maxperhour>\r\n    <email_log_source>alerts.log</email_log_source>\r\n
    \   <queue_size>131072</queue_size>\r\n    <agents_disconnection_time>20s</agents_disconnection_time>\r\n
    \   <agents_disconnection_alert_time>100s</agents_disconnection_alert_time>\r\n
    \ </global>\r\n\r\n  <alerts>\r\n    <log_alert_level>3</log_alert_level>\r\n
    \   <email_alert_level>12</email_alert_level>\r\n  </alerts>\r\n\r\n  <!-- Choose
    between \"plain\", \"json\", or \"plain,json\" for the format of internal logs
    -->\r\n  <logging>\r\n    <log_format>plain</log_format>\r\n  </logging>\r\n\r\n
    \ <remote>\r\n    <connection>secure</connection>\r\n    <port>1514</port>\r\n
    \   <protocol>tcp</protocol>\r\n    <queue_size>131072</queue_size>\r\n  </remote>\r\n\r\n
    \ <!-- Policy monitoring -->\r\n  <rootcheck>\r\n    <disabled>no</disabled>\r\n
    \   <check_unixaudit>yes</check_unixaudit>\r\n    <check_files>yes</check_files>\r\n
    \   <check_trojans>yes</check_trojans>\r\n    <check_dev>yes</check_dev>\r\n    <check_sys>yes</check_sys>\r\n
    \   <check_pids>yes</check_pids>\r\n    <check_ports>yes</check_ports>\r\n    <check_if>yes</check_if>\r\n\r\n
    \   <!-- Frequency that rootcheck is executed - every 12 hours -->\r\n    <frequency>43200</frequency>\r\n\r\n
    \   <rootkit_files>/var/ossec/etc/rootcheck/rootkit_files.txt</rootkit_files>\r\n
    \   <rootkit_trojans>/var/ossec/etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>\r\n\r\n
    \   <system_audit>/var/ossec/etc/rootcheck/system_audit_rcl.txt</system_audit>\r\n
    \   <system_audit>/var/ossec/etc/rootcheck/system_audit_ssh.txt</system_audit>\r\n\r\n
    \   <skip_nfs>yes</skip_nfs>\r\n  </rootcheck>\r\n\r\n  <wodle name=\"open-scap\">\r\n
    \   <disabled>yes</disabled>\r\n    <timeout>1800</timeout>\r\n    <interval>1d</interval>\r\n
    \   <scan-on-start>yes</scan-on-start>\r\n  </wodle>\r\n\r\n  <wodle name=\"cis-cat\">\r\n
    \   <disabled>yes</disabled>\r\n    <timeout>1800</timeout>\r\n    <interval>1d</interval>\r\n
    \   <scan-on-start>yes</scan-on-start>\r\n\r\n    <java_path>wodles/java</java_path>\r\n
    \   <ciscat_path>wodles/ciscat</ciscat_path>\r\n  </wodle>\r\n\r\n  <!-- Osquery
    integration -->\r\n  <wodle name=\"osquery\">\r\n    <disabled>yes</disabled>\r\n
    \   <run_daemon>yes</run_daemon>\r\n    <log_path>/var/log/osquery/osqueryd.results.log</log_path>\r\n
    \   <config_path>/etc/osquery/osquery.conf</config_path>\r\n    <add_labels>yes</add_labels>\r\n
    \ </wodle>\r\n\r\n  <!-- System inventory -->\r\n  <wodle name=\"syscollector\">\r\n
    \   <disabled>no</disabled>\r\n    <interval>1h</interval>\r\n    <scan_on_start>yes</scan_on_start>\r\n
    \   <hardware>yes</hardware>\r\n    <os>yes</os>\r\n    <network>yes</network>\r\n
    \   <packages>yes</packages>\r\n    <ports all=\"yes\">yes</ports>\r\n    <processes>yes</processes>\r\n
    \ </wodle>\r\n\r\n  <vulnerability-detection>\r\n    <enabled>yes</enabled>\r\n
    \   <index-status>yes</index-status>\r\n    <feed-update-interval>60m</feed-update-interval>\r\n
    \ </vulnerability-detection>\r\n\r\n  <indexer>\r\n    <enabled>yes</enabled>\r\n
    \   <hosts>\r\n      <host>https://indexer:9200</host>\r\n    </hosts>\r\n    <ssl>\r\n
    \     <certificate_authorities>\r\n        <ca>/etc/ssl/root-ca.pem</ca>\r\n      </certificate_authorities>\r\n
    \     <certificate>/etc/ssl/filebeat.pem</certificate>\r\n      <key>/etc/ssl/filebeat.key</key>\r\n
    \   </ssl>\r\n  </indexer>\r\n\r\n  <!-- File integrity monitoring -->\r\n  <syscheck>\r\n
    \   <disabled>no</disabled>\r\n\r\n    <!-- Frequency that syscheck is executed
    default every 12 hours -->\r\n    <frequency>43200</frequency>\r\n\r\n    <scan_on_start>yes</scan_on_start>\r\n\r\n
    \   <!-- Generate alert when new file detected -->\r\n    <alert_new_files>yes</alert_new_files>\r\n\r\n
    \   <!-- Don't ignore files that change more than 'frequency' times -->\r\n    <auto_ignore
    frequency=\"10\" timeframe=\"3600\">no</auto_ignore>\r\n\r\n    <!-- Directories
    to check  (perform all possible verifications) -->\r\n    <directories check_all=\"yes\">/etc,/usr/bin,/usr/sbin</directories>\r\n
    \   <directories check_all=\"yes\">/bin,/sbin,/boot</directories>\r\n\r\n    <!--
    Files/directories to ignore -->\r\n    <ignore>/etc/mtab</ignore>\r\n    <ignore>/etc/hosts.deny</ignore>\r\n
    \   <ignore>/etc/mail/statistics</ignore>\r\n    <ignore>/etc/random-seed</ignore>\r\n
    \   <ignore>/etc/random.seed</ignore>\r\n    <ignore>/etc/adjtime</ignore>\r\n
    \   <ignore>/etc/httpd/logs</ignore>\r\n    <ignore>/etc/utmpx</ignore>\r\n    <ignore>/etc/wtmpx</ignore>\r\n
    \   <ignore>/etc/cups/certs</ignore>\r\n    <ignore>/etc/dumpdates</ignore>\r\n
    \   <ignore>/etc/svc/volatile</ignore>\r\n    <ignore>/sys/kernel/security</ignore>\r\n
    \   <ignore>/sys/kernel/debug</ignore>\r\n\r\n    <!-- Check the file, but never
    compute the diff -->\r\n    <nodiff>/etc/ssl/private.key</nodiff>\r\n\r\n    <skip_nfs>yes</skip_nfs>\r\n\r\n
    \   <!-- Remove not monitored files -->\r\n    <remove_old_diff>yes</remove_old_diff>\r\n\r\n
    \   <!-- Allow the system to restart Auditd after installing the plugin -->\r\n
    \   <restart_audit>yes</restart_audit>\r\n  </syscheck>\r\n\r\n  <!-- Active response
    -->\r\n  <global>\r\n    <white_list>127.0.0.1</white_list>\r\n    <white_list>^localhost.localdomain$</white_list>\r\n
    \   <white_list>10.66.0.2</white_list>\r\n  </global>\r\n\r\n  <command>\r\n    <name>disable-account</name>\r\n
    \   <executable>disable-account.sh</executable>\r\n    <expect>user</expect>\r\n
    \   <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n  <command>\r\n
    \   <name>restart-ossec</name>\r\n    <executable>restart-ossec.sh</executable>\r\n
    \   <expect></expect>\r\n  </command>\r\n\r\n  <command>\r\n    <name>firewall-drop</name>\r\n
    \   <executable>firewall-drop</executable>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n
    \ </command>\r\n\r\n  <command>\r\n    <name>host-deny</name>\r\n    <executable>host-deny.sh</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>route-null</name>\r\n    <executable>route-null.sh</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>win_route-null</name>\r\n    <executable>route-null.cmd</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>win_route-null-2012</name>\r\n    <executable>route-null-2012.cmd</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>netsh</name>\r\n    <executable>netsh.cmd</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>netsh-win-2016</name>\r\n    <executable>netsh-win-2016.cmd</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <!--\r\n  <active-response>\r\n    active-response options here\r\n  </active-response>\r\n
    \ -->\r\n\r\n  <!-- Log analysis -->\r\n  <localfile>\r\n    <log_format>command</log_format>\r\n
    \   <command>df -P</command>\r\n    <frequency>360</frequency>\r\n  </localfile>\r\n\r\n
    \ <localfile>\r\n    <log_format>full_command</log_format>\r\n    <command>netstat
    -tulpn | sed 's/\\([[:alnum:]]\\+\\)\\ \\+[[:digit:]]\\+\\ \\+[[:digit:]]\\+\\
    \\+\\(.*\\):\\([[:digit:]]*\\)\\ \\+\\([0-9\\.\\:\\*]\\+\\).\\+\\ \\([[:digit:]]*\\/[[:alnum:]\\-]*\\).*/\\1
    \\2 == \\3 == \\4 \\5/' | sort -k 4 -g | sed 's/ == \\(.*\\) ==/:\\1/' | sed 1,2d</command>\r\n
    \   <alias>netstat listening ports</alias>\r\n    <frequency>360</frequency>\r\n
    \ </localfile>\r\n\r\n  <localfile>\r\n    <log_format>full_command</log_format>\r\n
    \   <command>last -n 20</command>\r\n    <frequency>360</frequency>\r\n  </localfile>\r\n\r\n
    \ <ruleset>\r\n    <!-- Default ruleset -->\r\n    <decoder_dir>ruleset/decoders</decoder_dir>\r\n
    \   <rule_dir>ruleset/rules</rule_dir>\r\n    <rule_exclude>0215-policy_rules.xml</rule_exclude>\r\n
    \   <list>etc/lists/audit-keys</list>\r\n    <list>etc/lists/amazon/aws-sources</list>\r\n
    \   <list>etc/lists/amazon/aws-eventnames</list>\r\n    <list>etc/lists/malicious-ioc/malicious-ip</list>\r\n
    \   <list>etc/lists/malicious-ioc/malicious-domains</list>\r\n    <list>etc/lists/malicious-ioc/malware-hashes</list>\r\n\r\n
    \   <!-- User-defined ruleset -->\r\n    <decoder_dir>etc/decoders</decoder_dir>\r\n
    \   <rule_dir>etc/rules</rule_dir>\r\n  </ruleset>\r\n\r\n  <rule_test>\r\n\t
    \   <enabled>yes</enabled>\r\n\t    <threads>1</threads>\r\n\t    <max_sessions>64</max_sessions>\r\n\t
    \   <session_timeout>15m</session_timeout>\r\n  </rule_test>\r\n\r\n  <!-- Configuration
    for ossec-authd\r\n    To enable this service, run:\r\n    wazuh-control enable
    auth\r\n  -->\r\n  <auth>\r\n    <disabled>no</disabled>\r\n    <port>1515</port>\r\n
    \   <use_source_ip>no</use_source_ip>\r\n    <force>\r\n      <enabled>yes</enabled>\r\n
    \     <key_mismatch>yes</key_mismatch>\r\n      <disconnected_time enabled=\"yes\">1h</disconnected_time>\r\n
    \     <after_registration_time>1h</after_registration_time>\r\n    </force>\r\n
    \   <purge>no</purge>\r\n    <use_password>yes</use_password>\r\n    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>\r\n
    \   <!-- <ssl_agent_ca></ssl_agent_ca> -->\r\n    <ssl_verify_host>no</ssl_verify_host>\r\n
    \   <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>\r\n    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>\r\n
    \   <ssl_auto_negotiate>no</ssl_auto_negotiate>\r\n  </auth>\r\n\r\n  <cluster>\r\n
    \   <name>wazuh</name>\r\n    <node_name>wazuh-manager-master</node_name>\r\n
    \   <node_type>master</node_type>\r\n    <key>to_be_replaced_by_cluster_key</key>\r\n
    \   <port>1516</port>\r\n    <bind_addr>0.0.0.0</bind_addr>\r\n    <nodes>\r\n
    \       <node>wazuh-manager-master-0.wazuh-cluster.wazuh</node>\r\n    </nodes>\r\n
    \   <hidden>no</hidden>\r\n    <disabled>no</disabled>\r\n  </cluster>\r\n</ossec_config>\r\n\r\n<ossec_config>\r\n
    \ <localfile>\r\n    <log_format>syslog</log_format>\r\n    <location>/var/ossec/logs/active-responses.log</location>\r\n
    \ </localfile>\r\n\r\n</ossec_config>\r\n"
  worker.conf: "<!--\r\n  Wazuh - Manager - Default configuration for ubuntu 16.04\r\n
    \ More info at: https://documentation.wazuh.com\r\n  Mailing list: https://groups.google.com/forum/#!forum/wazuh\r\n\r\n
    \ Customization: TCP on port 1514\r\n  Customization: Cluster mode enabled, worker
    node\r\n-->\r\n<ossec_config>\r\n  <global>\r\n    <jsonout_output>yes</jsonout_output>\r\n
    \   <alerts_log>yes</alerts_log>\r\n    <logall>no</logall>\r\n    <logall_json>no</logall_json>\r\n
    \   <email_notification>no</email_notification>\r\n    <smtp_server>smtp.example.wazuh.com</smtp_server>\r\n
    \   <email_from>ossecm@example.wazuh.com</email_from>\r\n    <email_to>recipient@example.wazuh.com</email_to>\r\n
    \   <email_maxperhour>12</email_maxperhour>\r\n    <email_log_source>alerts.log</email_log_source>\r\n
    \   <queue_size>131072</queue_size>\r\n    <agents_disconnection_time>20s</agents_disconnection_time>\r\n
    \   <agents_disconnection_alert_time>100s</agents_disconnection_alert_time>\r\n
    \ </global>\r\n\r\n  <alerts>\r\n    <log_alert_level>3</log_alert_level>\r\n
    \   <email_alert_level>12</email_alert_level>\r\n  </alerts>\r\n\r\n  <!-- Choose
    between \"plain\", \"json\", or \"plain,json\" for the format of internal logs
    -->\r\n  <logging>\r\n    <log_format>plain</log_format>\r\n  </logging>\r\n\r\n
    \ <remote>\r\n    <connection>secure</connection>\r\n    <port>1514</port>\r\n
    \   <protocol>tcp</protocol>\r\n    <queue_size>131072</queue_size>\r\n  </remote>\r\n\r\n
    \ <!-- Policy monitoring -->\r\n  <rootcheck>\r\n    <disabled>no</disabled>\r\n
    \   <check_unixaudit>yes</check_unixaudit>\r\n    <check_files>yes</check_files>\r\n
    \   <check_trojans>yes</check_trojans>\r\n    <check_dev>yes</check_dev>\r\n    <check_sys>yes</check_sys>\r\n
    \   <check_pids>yes</check_pids>\r\n    <check_ports>yes</check_ports>\r\n    <check_if>yes</check_if>\r\n\r\n
    \   <!-- Frequency that rootcheck is executed - every 12 hours -->\r\n    <frequency>43200</frequency>\r\n\r\n
    \   <rootkit_files>/var/ossec/etc/rootcheck/rootkit_files.txt</rootkit_files>\r\n
    \   <rootkit_trojans>/var/ossec/etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>\r\n\r\n
    \   <system_audit>/var/ossec/etc/rootcheck/system_audit_rcl.txt</system_audit>\r\n
    \   <system_audit>/var/ossec/etc/rootcheck/system_audit_ssh.txt</system_audit>\r\n\r\n
    \   <skip_nfs>yes</skip_nfs>\r\n  </rootcheck>\r\n\r\n  <wodle name=\"open-scap\">\r\n
    \   <disabled>yes</disabled>\r\n    <timeout>1800</timeout>\r\n    <interval>1d</interval>\r\n
    \   <scan-on-start>yes</scan-on-start>\r\n  </wodle>\r\n\r\n  <wodle name=\"cis-cat\">\r\n
    \   <disabled>yes</disabled>\r\n    <timeout>1800</timeout>\r\n    <interval>1d</interval>\r\n
    \   <scan-on-start>yes</scan-on-start>\r\n\r\n    <java_path>wodles/java</java_path>\r\n
    \   <ciscat_path>wodles/ciscat</ciscat_path>\r\n  </wodle>\r\n\r\n  <!-- Osquery
    integration -->\r\n  <wodle name=\"osquery\">\r\n    <disabled>yes</disabled>\r\n
    \   <run_daemon>yes</run_daemon>\r\n    <log_path>/var/log/osquery/osqueryd.results.log</log_path>\r\n
    \   <config_path>/etc/osquery/osquery.conf</config_path>\r\n    <add_labels>yes</add_labels>\r\n
    \ </wodle>\r\n\r\n  <!-- System inventory -->\r\n  <wodle name=\"syscollector\">\r\n
    \   <disabled>no</disabled>\r\n    <interval>1h</interval>\r\n    <scan_on_start>yes</scan_on_start>\r\n
    \   <hardware>yes</hardware>\r\n    <os>yes</os>\r\n    <network>yes</network>\r\n
    \   <packages>yes</packages>\r\n    <ports all=\"yes\">yes</ports>\r\n    <processes>yes</processes>\r\n
    \ </wodle>\r\n\r\n  <vulnerability-detection>\r\n    <enabled>yes</enabled>\r\n
    \   <index-status>yes</index-status>\r\n    <feed-update-interval>60m</feed-update-interval>\r\n
    \ </vulnerability-detection>\r\n\r\n  <indexer>\r\n    <enabled>yes</enabled>\r\n
    \   <hosts>\r\n      <host>https://indexer:9200</host>\r\n    </hosts>\r\n    <ssl>\r\n
    \     <certificate_authorities>\r\n        <ca>/etc/ssl/root-ca.pem</ca>\r\n      </certificate_authorities>\r\n
    \     <certificate>/etc/ssl/filebeat.pem</certificate>\r\n      <key>/etc/ssl/filebeat.key</key>\r\n
    \   </ssl>\r\n  </indexer>\r\n\r\n  <!-- File integrity monitoring -->\r\n  <syscheck>\r\n
    \   <disabled>no</disabled>\r\n\r\n    <!-- Frequency that syscheck is executed
    default every 12 hours -->\r\n    <frequency>43200</frequency>\r\n\r\n    <scan_on_start>yes</scan_on_start>\r\n\r\n
    \   <!-- Generate alert when new file detected -->\r\n    <alert_new_files>yes</alert_new_files>\r\n\r\n
    \   <!-- Don't ignore files that change more than 'frequency' times -->\r\n    <auto_ignore
    frequency=\"10\" timeframe=\"3600\">no</auto_ignore>\r\n\r\n    <!-- Directories
    to check  (perform all possible verifications) -->\r\n    <directories check_all=\"yes\">/etc,/usr/bin,/usr/sbin</directories>\r\n
    \   <directories check_all=\"yes\">/bin,/sbin,/boot</directories>\r\n\r\n    <!--
    Files/directories to ignore -->\r\n    <ignore>/etc/mtab</ignore>\r\n    <ignore>/etc/hosts.deny</ignore>\r\n
    \   <ignore>/etc/mail/statistics</ignore>\r\n    <ignore>/etc/random-seed</ignore>\r\n
    \   <ignore>/etc/random.seed</ignore>\r\n    <ignore>/etc/adjtime</ignore>\r\n
    \   <ignore>/etc/httpd/logs</ignore>\r\n    <ignore>/etc/utmpx</ignore>\r\n    <ignore>/etc/wtmpx</ignore>\r\n
    \   <ignore>/etc/cups/certs</ignore>\r\n    <ignore>/etc/dumpdates</ignore>\r\n
    \   <ignore>/etc/svc/volatile</ignore>\r\n    <ignore>/sys/kernel/security</ignore>\r\n
    \   <ignore>/sys/kernel/debug</ignore>\r\n\r\n    <!-- Check the file, but never
    compute the diff -->\r\n    <nodiff>/etc/ssl/private.key</nodiff>\r\n\r\n    <skip_nfs>yes</skip_nfs>\r\n\r\n
    \   <!-- Remove not monitored files -->\r\n    <remove_old_diff>yes</remove_old_diff>\r\n\r\n
    \   <!-- Allow the system to restart Auditd after installing the plugin -->\r\n
    \   <restart_audit>yes</restart_audit>\r\n  </syscheck>\r\n\r\n  <!-- Active response
    -->\r\n  <global>\r\n    <white_list>127.0.0.1</white_list>\r\n    <white_list>^localhost.localdomain$</white_list>\r\n
    \   <white_list>10.66.0.2</white_list>\r\n  </global>\r\n\r\n  <command>\r\n    <name>disable-account</name>\r\n
    \   <executable>disable-account.sh</executable>\r\n    <expect>user</expect>\r\n
    \   <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n  <command>\r\n
    \   <name>restart-ossec</name>\r\n    <executable>restart-ossec.sh</executable>\r\n
    \   <expect></expect>\r\n  </command>\r\n\r\n  <command>\r\n    <name>firewall-drop</name>\r\n
    \   <executable>firewall-drop</executable>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n
    \ </command>\r\n\r\n  <command>\r\n    <name>host-deny</name>\r\n    <executable>host-deny.sh</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>route-null</name>\r\n    <executable>route-null.sh</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>win_route-null</name>\r\n    <executable>route-null.cmd</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>win_route-null-2012</name>\r\n    <executable>route-null-2012.cmd</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
    \ <command>\r\n    <name>netsh</name>\r\n    <executable>netsh.cmd</executable>\r\n
    \   <expect>srcip</expect>\r\n    <timeout_allowed>yes</timeout_allowed>\r\n  </command>\r\n\r\n
