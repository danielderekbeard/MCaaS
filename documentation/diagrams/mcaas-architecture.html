<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCaaS Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 1200px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 11px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .edge-dashed {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 6 5;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
  .zone-fill {
    fill: var(--neutral);
    opacity: 0.2;
  }
  .zone-title {
    font-size: 12px;
    font-weight: 600;
    fill: var(--muted);
  }
</style>
<main>
  <svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions for arrow markers -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
      <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
      </marker>
    </defs>

    <!-- Title -->
    <text x="600" y="30" text-anchor="middle" class="title">MCaaS Platform Architecture</text>
    <text x="600" y="55" text-anchor="middle" class="small">Managed Compliance as a Service - Kubernetes Deployment</text>

    <!-- Trust Boundary: Client Assets -->
    <rect x="20" y="100" width="250" height="180" rx="8" class="zone-fill" />
    <rect x="20" y="100" width="250" height="180" rx="8" class="zone" />
    <text x="145" y="125" text-anchor="middle" class="zone-title">CLIENT ASSETS</text>

    <!-- Endpoints -->
    <rect x="45" y="145" width="200" height="60" rx="4" class="node input" />
    <text x="145" y="175" text-anchor="middle" class="label">Workstations</text>
    <text x="145" y="195" text-anchor="middle" class="small">Windows/Linux/macOS</text>

    <!-- Network Devices -->
    <rect x="45" y="220" width="95" height="45" rx="4" class="node input" />
    <text x="92" y="240" text-anchor="middle" class="label" style="font-size: 12px;">Firewalls</text>
    <text x="92" y="255" text-anchor="middle" class="small">PFSense</text>

    <rect x="150" y="220" width="95" height="45" rx="4" class="node input" />
    <text x="197" y="240" text-anchor="middle" class="label" style="font-size: 12px;">Network</text>
    <text x="197" y="255" text-anchor="middle" class="small">OKEANIS</text>

    <!-- Trust Boundary: security-ops Namespace -->
    <rect x="300" y="100" width="260" height="400" rx="8" class="zone-fill" />
    <rect x="300" y="100" width="260" height="400" rx="8" class="zone" />
    <text x="430" y="125" text-anchor="middle" class="zone-title">SECURITY-OPS Namespace</text>

    <!-- Wazuh Components -->
    <rect x="325" y="145" width="210" height="80" rx="4" class="node risk" />
    <text x="430" y="175" text-anchor="middle" class="label">Wazuh SIEM & XDR</text>
    <text x="430" y="195" text-anchor="middle" class="small">Manager + Dashboard</text>
    <text x="430" y="212" text-anchor="middle" class="small">Port: 1514 / 55000</text>

    <!-- OpenSearch -->
    <rect x="325" y="245" width="210" height="60" rx="4" class="node storage" />
    <text x="430" y="275" text-anchor="middle" class="label">OpenSearch</text>
    <text x="430" y="292" text-anchor="middle" class="small">Security-ops Indexer :9200</text>

    <!-- Shuffle -->
    <rect x="325" y="325" width="210" height="65" rx="4" class="node process" />
    <text x="430" y="355" text-anchor="middle" class="label">Shuffle SOAR</text>
    <text x="430" y="372" text-anchor="middle" class="small">Workflow Automation :3008</text>

    <!-- SMTP Relay -->
    <rect x="325" y="410" width="210" height="55" rx="4" class="node external" />
    <text x="430" y="435" text-anchor="middle" class="label">SMTP Relay</text>
    <text x="430" y="452" text-anchor="middle" class="small">Postfix → Zoho Mail :25</text>

    <!-- Trust Boundary: managed-it Namespace -->
    <rect x="600" y="100" width="260" height="280" rx="8" class="zone-fill" />
    <rect x="600" y="100" width="260" height="280" rx="8" class="zone" />
    <text x="730" y="125" text-anchor="middle" class="zone-title">MANAGED-IT Namespace</text>

    <!-- PostgreSQL -->
    <rect x="625" y="145" width="210" height="70" rx="4" class="node storage" />
    <text x="730" y="175" text-anchor="middle" class="label">PostgreSQL</text>
    <text x="730" y="195" text-anchor="middle" class="small">Shared Database :5432</text>

    <!-- Zammad -->
    <rect x="625" y="235" width="210" height="60" rx="4" class="node process" />
    <text x="730" y="260" text-anchor="middle" class="label">Zammad Helpdesk</text>
    <text x="730" y="277" text-anchor="middle" class="small">IT Ticketing System</text>

    <!-- Redis -->
    <rect x="625" y="315" width="100" height="50" rx="4" class="node storage" />
    <text x="675" y="340" text-anchor="middle" class="label" style="font-size: 12px;">Redis</text>
    <text x="675" y="355" text-anchor="middle" class="small" style="font-size: 10px;">Cache :6379</text>

    <!-- Trust Boundary: grc Namespace -->
    <rect x="900" y="100" width="260" height="150" rx="8" class="zone-fill" />
    <rect x="900" y="100" width="260" height="150" rx="8" class="zone" />
    <text x="1030" y="125" text-anchor="middle" class="zone-title">GRC Namespace</text>

    <!-- CISO Assistant -->
    <rect x="925" y="145" width="210" height="80" rx="4" class="node process" />
    <text x="1030" y="175" text-anchor="middle" class="label">CISO Assistant</text>
    <text x="1030" y="195" text-anchor="middle" class="small">GRC Management</text>
    <text x="1030" y="212" text-anchor="middle" class="small">Compliance & Risk</text>

    <!-- External Services -->
    <rect x="900" y="280" width="260" height="120" rx="8" class="zone-fill" />
    <rect x="900" y="280" width="260" height="120" rx="8" class="zone" />
    <text x="1030" y="305" text-anchor="middle" class="zone-title">EXTERNAL SERVICES</text>

    <rect x="925" y="325" width="210" height="55" rx="4" class="node external" />
    <text x="1030" y="355" text-anchor="middle" class="label">Zoho Mail</text>

    <!-- Connection Lines -->
    <!-- Workstation -> Wazuh -->
    <line x1="245" y1="175" x2="325" y2="185" class="edge" marker-end="url(#arrow)" />

    <!-- Wazuh -> OpenSearch -->
    <line x1="430" y1="225" x2="430" y2="245" class="edge" marker-end="url(#arrow)" />

    <!-- Wazuh -> Shuffle -->
    <path d="M 430 225 L 430 270 L 260 270 L 260 357 L 325 357" class="edge-dashed" marker-end="url(#arrow-dashed)" />
    <text x="270" y="265" class="small" style="font-size: 10px;">Webhook</text>

    <!-- Shuffle -> OpenSearch -->
    <line x1="430" y1="325" x2="430" y2="305" class="edge" marker-end="url(#arrow)" />

    <!-- Shuffle -> Zammad -->
    <line x1="535" y1="357" x2="625" y2="265" class="edge-dashed" marker-end="url(#arrow-dashed)" />
    <text x="570" y="320" class="small" style="font-size: 10px;">API</text>

    <!-- Shuffle -> SMTP -->
    <line x1="430" y1="390" x2="430" y2="410" class="edge" marker-end="url(#arrow)" />

    <!-- SMTP -> Zoho -->
    <line x1="535" y1="437" x2="925" y2="352" class="edge-dashed" marker-end="url(#arrow-dashed)" />

    <!-- PostgreSQL -> Zammad -->
    <line x1="730" y1="215" x2="730" y2="235" class="edge" marker-end="url(#arrow)" />

    <!-- PostgreSQL -> CISO Assistant -->
    <line x1="835" y1="180" x2="925" y2="180" class="edge-dashed" marker-end="url(#arrow-dashed)" />
    <text x="870" y="175" class="small" style="font-size: 10px;">Cross-namespace</text>

    <!-- Zammad -> Redis -->
    <line x1="730" y1="295" x2="675" y2="315" class="edge" marker-end="url(#arrow)" />

    <!-- Legend -->
    <rect x="20" y="520" width="1140" height="140" rx="8" class="zone" />
    <text x="40" y="550" class="title" style="font-size: 16px;">Legend</text>

    <rect x="40" y="565" width="100" height="35" rx="4" class="node input" />
    <text x="90" y="585" text-anchor="middle" class="label" style="font-size: 12px;">Input/Agent</text>

    <rect x="160" y="565" width="100" height="35" rx="4" class="node process" />
    <text x="210" y="585" text-anchor="middle" class="label" style="font-size: 12px;">Process</text>

    <rect x="280" y="565" width="100" height="35" rx="4" class="node storage" />
    <text x="330" y="585" text-anchor="middle" class="label" style="font-size: 12px;">Storage</text>

    <rect x="400" y="565" width="100" height="35" rx="4" class="node risk" />
    <text x="450" y="585" text-anchor="middle" class="label" style="font-size: 12px;">Security</text>

    <rect x="520" y="565" width="100" height="35" rx="4" class="node external" />
    <text x="570" y="585" text-anchor="middle" class="label" style="font-size: 12px;">External</text>

    <text x="40" y="620" class="small">Solid lines: Internal API communication | Dashed lines: Webhooks/External</text>
    <text x="40" y="640" class="small">security-ops: SIEM + SOAR | managed-it: Ticketing + Database | grc: Governance & Compliance</text>

    <!-- Data Flow Annotations -->
    <text x="600" y="700" text-anchor="middle" class="title" style="font-size: 16px;">Alert Data Flow</text>
    <text x="600" y="725" text-anchor="middle" class="small">1. Agent detects threat → 2. Wazuh generates alert → 3. Shuffle webhook receives alert → 4. Shuffle enriches data</text>
    <text x="600" y="745" text-anchor="middle" class="small">5. Shuffle creates Zammad ticket → 6. Analyst investigates → 7. CISO Assistant tracks for compliance</text>
  </svg>
</main>
