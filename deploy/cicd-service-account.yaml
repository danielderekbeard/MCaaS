apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin # WARNING: This is highly permissive. For production, create a more restrictive role.
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: kube-system