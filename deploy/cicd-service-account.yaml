# ============================================================
# ServiceAccount, Token Secret & RBAC for GitHub Actions CI/CD
#
# Kubernetes 1.24+ no longer auto-creates long-lived tokens for
# ServiceAccounts.  The Secret below must be created explicitly
# so that the kubeconfig used by GitHub Actions has a valid bearer
# token.
#
# After applying this manifest, extract the token and rebuild the
# KUBE_CONFIG_DATA secret:
#   TOKEN=$(kubectl -n kube-system get secret github-actions-deployer-token \
#             -o jsonpath='{.data.token}' | base64 -d)
#   ./scripts/generate-kubeconfig.sh   # or .ps1
#   # Then update the GitHub repo secret KUBE_CONFIG_DATA with the
#   # base64-encoded kubeconfig.
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
  namespace: kube-system
automountServiceAccountToken: false   # only used off-cluster
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-deployer-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: github-actions-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin # WARNING: This is highly permissive. For production, create a more restrictive role.
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: kube-system