postgresql:
  enabled: false
externalDatabase:
  host: "mcaas-postgresql-postgresql.managed-it.svc.cluster.local"
  port: 5432
  user: "postgres"
  passwordSecret:
    name: "mcaas-postgresql-secret"
    key: "postgres-password"
database: "ciso_assistant"
frontend:
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
