# =============================================================================
# MCaaS Zammad Helm Values (Zammad chart v16.4.6+)
# =============================================================================
# Key notes:
# - Redis sub-chart: cloudpirates-redis (replaced Bitnami in v16.0.0)
# - Memcached sub-chart: cloudpirates-memcached (replaced Bitnami in v16.0.0)
# - When zammadConfig.redis.enabled=true, Zammad templates override host/port
#   to use <release>-redis:6379 (ignoring zammadConfig.redis.host)
# - zammadConfig.redis.pass is only a boolean trigger; actual password comes
#   from the K8s secret referenced by secrets.redis.secretName
# =============================================================================

zammadConfig:
  postgresql:
    enabled: false
    host: "mcaas-postgresql.managed-it.svc.cluster.local"
    port: 5432
    user: "postgres"
    pass: ""  # Password comes from secrets.postgresql existing secret
    db: "zammad"
  elasticsearch:
    enabled: false
    initialisation: false  # Skip elasticsearch-init container since ES is disabled
  redis:
    enabled: true
    # NOTE: host is ignored by Zammad templates when redis sub-chart is enabled.
    # The actual service name is derived from the Helm release name: <release>-redis
    host: "mcaas-zammad-redis"
    port: 6379
    pass: "zammad"  # Only a boolean trigger; actual password comes from K8s secret

# Use existing secrets for PostgreSQL and Redis
secrets:
  postgresql:
    useExisting: true
    secretName: "mcaas-postgresql-secret"
    secretKey: "postgres-password"
  redis:
    useExisting: true
    secretName: "mcaas-zammad-redis-pass"
    secretKey: "redis-password"

# Disable sub-charts (redundant with zammadConfig conditions, but explicit)
postgresql:
  enabled: false
elasticsearch:
  enabled: false

# Configure the cloudpirates-redis sub-chart to use our existing secret.
# When auth.existingSecret is set, the chart uses that secret and does NOT
# create its own secret. auth.existingSecretPasswordKey specifies which key
# in the secret contains the password (default in cloudpirates-redis is "",
# so we must set it explicitly).
redis:
  architecture: standalone
  auth:
    existingSecret: "mcaas-zammad-redis-pass"
    existingSecretPasswordKey: "redis-password"

# Enable Ingress to expose the Zammad UI externally
ingress:
  enabled: true
  className: "nginx"
  hosts:
    # IMPORTANT: Replace zammad.mcaas.example.com with your actual domain.
    # If you don't have a domain, set ingress.enabled=false and use port-forward instead.
    - host: zammad.mcaas.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
