zammadConfig:
  postgresql:
    enabled: false
    host: "mcaas-postgresql-postgresql.managed-it.svc.cluster.local"
    port: 5432
    user: "postgres"
    pass: ""  # Retrieved from externalDatabase passwordSecret below
    db: "zammad"
  elasticsearch:
    enabled: false

# External database connection (used by Zammad when zammadConfig.postgresql.enabled=false)
externalDatabase:
  host: "mcaas-postgresql-postgresql.managed-it.svc.cluster.local"
  port: 5432
  user: "postgres"
  passwordSecret:
    name: "mcaas-postgresql-secret"
    key: "postgres-password"
database: "zammad"

# Disable the Bitnami sub-charts (redundant with zammadConfig conditions, but explicit)
postgresql:
  enabled: false
elasticsearch:
  enabled: false

# Enable Ingress to expose the Zammad UI externally
ingress:
  enabled: true
  className: "nginx" # Specify your ingress controller class
  hosts:
    # IMPORTANT: Replace zammad.mcaas.example.com with your actual domain.
    # If you don't have a domain, set ingress.enabled=false and use port-forward instead.
    - host: zammad.mcaas.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
