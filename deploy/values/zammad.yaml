zammadConfig:
  postgresql:
    enabled: false
    host: "mcaas-postgresql-postgresql.managed-it.svc.cluster.local"
    port: 5432
    user: "postgres"
    pass: ""  # Password comes from secrets.postgresql existing secret
    db: "zammad"
  elasticsearch:
    enabled: false

# Use our existing PostgreSQL secret so init containers get the correct password
secrets:
  postgresql:
    useExisting: true
    secretName: "mcaas-postgresql-secret"
    secretKey: "postgres-password"

# Disable the Bitnami sub-charts (redundant with zammadConfig conditions, but explicit)
postgresql:
  enabled: false
elasticsearch:
  enabled: false

# Enable Ingress to expose the Zammad UI externally
ingress:
  enabled: true
  className: "nginx" # Specify your ingress controller class
  hosts:
    # IMPORTANT: Replace zammad.mcaas.example.com with your actual domain.
    # If you don't have a domain, set ingress.enabled=false and use port-forward instead.
    - host: zammad.mcaas.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
