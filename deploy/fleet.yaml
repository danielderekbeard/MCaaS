# fleet.yaml - Rancher GitOps Manifest
# This file instructs Rancher's Fleet to deploy the MCaaS stack from this repository.
#
# Prerequisites:
#   1. Secrets must be created BEFORE applying this Fleet config:
#      - mcaas-postgresql-secret in managed-it namespace (keys: postgres-password, password)
#      - mcaas-opensearch-secret in security-ops namespace (key: opensearch-password)
#      Use scripts/init-secrets.sh or scripts/init-secrets.ps1, or deploy.py does this automatically.
#
#   2. OCI charts (CISO Assistant, Shuffle) require container registry credentials:
#      kubectl create secret docker-registry ghcr-creds \
#        --docker-server=ghcr.io \
#        --docker-username=<username> \
#        --docker-password=<pat> \
#        -n fleet-default
#
#   3. Wazuh is deployed via kustomize (not Helm) and cannot be managed by Fleet.
#      Use deploy.py or deploy.sh to deploy Wazuh separately.

defaultNamespace: default

# Target all clusters managed by this Rancher instance.
# You can use cluster selectors to target specific clusters.
targetCustomizations:
- name: default
  clusterSelector: {}
  helm:
    # Define the Helm repositories needed for the charts
    repos:
    - name: bitnami
      repo: https://charts.bitnami.com/bitnami
    - name: opensearch
      repo: https://opensearch-project.github.io/helm-charts
    - name: zammad
      repo: https://zammad.github.io/zammad-helm

  # Define the Helm releases to be deployed
  releases:
  - name: mcaas-postgresql
    chart: bitnami/postgresql
    namespace: managed-it
    valuesFiles:
    - deploy/values/postgresql.yaml
  - name: mcaas-opensearch
    chart: opensearch/opensearch
    namespace: security-ops
    valuesFiles:
    - deploy/values/opensearch.yaml
  - name: mcaas-shuffle
    chart: oci://ghcr.io/shuffle/charts/shuffle
    namespace: security-ops
    valuesFiles:
    - deploy/values/shuffle.yaml
    dependsOn:
    - name: mcaas-opensearch
  - name: zammad
    chart: zammad/zammad
    namespace: managed-it
    valuesFiles:
    - deploy/values/zammad.yaml
    dependsOn:
    - name: mcaas-postgresql
  - name: ciso-assistant
    chart: oci://ghcr.io/intuitem/helm-charts/ce/ciso-assistant
    version: 0.11.4
    namespace: grc
    valuesFiles:
    - deploy/values/ciso-assistant.yaml
    dependsOn:
    - name: mcaas-postgresql

kustomizations:
- name: namespaces
  dir: deploy