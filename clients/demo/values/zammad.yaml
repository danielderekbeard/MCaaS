zammadConfig:
  postgresql:
    enabled: false
    host: "demo-postgresql.demo-managed-it.svc.cluster.local"
    port: 5432
    user: "postgres"
    pass: ""
    db: "zammad"
  elasticsearch:
    enabled: false
    initialisation: false
  redis:
    enabled: true
    host: "demo-zammad-redis"
    port: 6379
    pass: "zammad"
secrets:
  postgresql:
    useExisting: true
    secretName: "demo-postgresql-secret"
    secretKey: "postgres-password"