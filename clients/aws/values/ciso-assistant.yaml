# AWS/EKS-specific values for CISO Assistant Helm chart
# Overrides the default deploy/values/ciso-assistant.yaml for AWS EKS
#
# Key AWS differences from the k3s deployment:
# - Uses AWS ALB IngressClass instead of nginx
# - Adds TLS annotations for cert-manager with ALB
# - Adds resource requests for EKS scheduling

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: true
  hosts:
    - name: ciso.app.skyddex.com

postgresql:
  enabled: false

externalPostgresql:
  host: mcaas-postgresql.managed-it.svc.cluster.local
  port: 5432
  username: postgres
  database: ciso-assistant
  existingSecret:
    name: mcaas-postgresql-secret
    key: postgres-password

django:
  existingSecret: mcaas-ciso-secret
  existingSecretKey: django-secret-key

resources:
  requests:
    cpu: 250m
    memory: 256Mi