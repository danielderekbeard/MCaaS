# =============================================================================
# MCaaS Client Configuration Template
# =============================================================================
# Copy this directory to clients/<client-name>/ and update all values.
# The "name" field must match the directory name.
#
# Naming convention:
#   - Client name: lowercase, hyphenated (e.g., "acme", "big-corp")
#   - Branch:      client/<client-name> (e.g., "client/acme")
# =============================================================================

client:
  # Required: Short identifier for this client (must match directory name)
  name: ""

  # Display name for logging and reports
  display_name: ""

  # Domain suffix for ingress hosts
  # Example: "acme.example.com" → alala.acme.example.com, strategos.acme.example.com
  domain: ""

  # Resource prefix applied to all Helm releases, secrets, and DB names
  # Replaces "mcaas-" in all resource names
  # Example: "acme" → acme-postgresql, acme-opensearch, etc.
  prefix: ""

  # Namespace mapping (base → client-specific)
  # Each base namespace gets the client prefix prepended
  namespaces:
    managed-it: ""      # e.g., "acme-managed-it"
    security-ops: ""    # e.g., "acme-security-ops"
    grc: ""            # e.g., "acme-grc"
    wazuh: ""           # e.g., "acme-wazuh"

  # Kubernetes cluster context (optional — uses current context if not set)
  # Set this to automatically switch to the correct cluster before deploying
  # kube_context: ""

  # Wazuh version (pinned per client for stability)
  wazuh_version: "4.14.6"

  # PostgreSQL database name
  database_name: ""     # e.g., "acme_db"

  # Ingress configuration
  ingress:
    zammad_host: ""     # e.g., "alala.acme.example.com"
    ciso_host: ""       # e.g., "strategos.acme.example.com"
    shuffle_host: ""    # e.g., "kydoimos.acme.example.com"
    wazuh_host: ""      # e.g., "deimos.acme.example.com"

  # AWS-specific settings (used by deploy-aws.py for EKS deployments)
  # Remove this section for non-AWS deployments.
  aws:
    cluster_name: ""    # e.g., "acme-eks"
    region: ""          # e.g., "eu-west-1"
    node_group_workers:
      instance_type: "m5.xlarge"
      desired_capacity: 4
      min_size: 3
      max_size: 8
    node_group_monitoring:
      instance_type: "m5.2xlarge"
      desired_capacity: 2
      min_size: 1
      max_size: 4

    # ACM certificate ARNs for each service (import from K8s TLS secrets into AWS ACM)
    # These are required for ALB Ingress to serve HTTPS traffic.
    # After cert-manager issues TLS certs, export and import to ACM, then add ARNs here.
    acm_cert_arns:
      wazuh: ""
      shuffle: ""
      ciso: ""
      zammad: ""

    # Let's Encrypt registration email for cert-manager
    letsencrypt_email: ""