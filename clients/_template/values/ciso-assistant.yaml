# =============================================================================
# MCaaS Client CISO Assistant Values Template
# =============================================================================
# Replace placeholders:
#   <prefix>          → client resource prefix (e.g., "acme")
#   <prefix-managed-it> → client's managed-it namespace (e.g., "acme-managed-it")
#   <ciso_domain>     → client's CISO Assistant domain (e.g., "strategos.acme.example.com")
# =============================================================================

postgresql:
  enabled: false
global:
  domain: <ciso_domain>
backend:
  config:
    databaseType: externalPgsql
    djangoSecretKey: ""
    djangoExistingSecretKey: "<prefix>-ciso-secret"
externalPgsql:
  host: "<prefix>-postgresql.<prefix>-managed-it.svc.cluster.local"
  port: 5432
  user: "postgres"
  existingSecret: "<prefix>-postgresql-secret"
  database: "ciso-assistant"
ingress:
  enabled: true
  ingressClassName: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
  tls:
    enabled: true