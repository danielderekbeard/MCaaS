# AWS Load Balancer Controller IngressClass and configuration
# This replaces nginx ingress controller used in the original MCaaS deployment.
# The AWS Load Balancer Controller must be installed before applying this manifest.

---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: ingress.k8s.aws/alb

---
# ClusterIssuer for Let's Encrypt via cert-manager (HTTP01 challenge)
# Works out of the box with the ALB Ingress Controller.
# Replace the email address with your own.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@skyddex.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: alb

---
# Staging ClusterIssuer for testing (uses Let's Encrypt staging server)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@skyddex.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: alb

---
# DNS01 ClusterIssuer for Cloudflare (recommended for *.app.skyddex.com)
# This uses the Cloudflare DNS01 challenge which supports wildcard certificates.
#
# Prerequisites:
#   1. Create a Cloudflare API token with DNS Edit permission for app.skyddex.com
#   2. Create a Kubernetes secret with the token:
#      kubectl create secret generic cloudflare-api-token-secret \
#        --namespace cert-manager \
#        --from-literal=api-token=<YOUR_CLOUDFLARE_API_TOKEN>
#   3. Uncomment this ClusterIssuer block
#   4. Update your Ingress annotations to use: cert-manager.io/cluster-issuer: letsencrypt-cloudflare
#
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: letsencrypt-cloudflare
# spec:
#   acme:
#     server: https://acme-v02.api.letsencrypt.org/directory
#     email: admin@skyddex.com
#     privateKeySecretRef:
#       name: letsencrypt-cloudflare
#     solvers:
#       - dns01:
#           cloudflare:
#             apiTokenSecretRef:
#               name: cloudflare-api-token-secret
#               key: api-token