# AWS Load Balancer Controller IngressClass and configuration
# This replaces nginx ingress controller used in the original MCaaS deployment.
# The AWS Load Balancer Controller must be installed before applying this manifest.

---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: ingress.k8s.aws/alb

---
# ClusterIssuer for Let's Encrypt via cert-manager
# Configure with your Route53 hosted zone and email address before applying.
# This replaces the self-signed certificates used in the k3s deployment.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@mcaas.example.com  # CHANGE THIS
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: alb

---
# Staging ClusterIssuer for testing (uses Let's Encrypt staging server)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@mcaas.example.com  # CHANGE THIS
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: alb

