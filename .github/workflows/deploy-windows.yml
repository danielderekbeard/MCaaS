name: Deploy MCaaS (Windows)

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name (loads clients/<name>/config.yaml). Leave empty for default mcaas configuration.'
        required: false
        default: ''
        type: string
      skip_health_check:
        description: 'Skip post-deploy health checks'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Set up kubeconfig
        run: |
          $kubeDir = "$HOME\.kube"
          if (-not (Test-Path $kubeDir)) {
            New-Item -Path $kubeDir -ItemType Directory | Out-Null
          }
          $kubeConfigPath = "$kubeDir\config"
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")) | Set-Content -Path $kubeConfigPath

          # Patch kubeconfig to skip TLS verification for local self-signed clusters.
          # The self-hosted runner connects to a local k3s/Rancher Desktop cluster
          # whose API server (127.0.0.1:6443) uses a self-signed certificate that
          # is not in the Windows trust store. Without this, kubectl fails with
          # "x509: certificate signed by unknown authority".
          # Replace certificate-authority-data / certificate-authority entries
          # with insecure-skip-tls-verify: true on all cluster definitions.
          $yaml = Get-Content $kubeConfigPath -Raw
          $yaml = $yaml -replace '(?m)^(\s*)certificate-authority-data:.*$', '$1insecure-skip-tls-verify: true'
          $yaml = $yaml -replace '(?m)^(\s*)certificate-authority:.*$', '$1insecure-skip-tls-verify: true'
          $yaml | Set-Content $kubeConfigPath -NoNewline

      - name: Deploy MCaaS stack
        run: |
          $args = @()
          if ("${{ inputs.client }}") {
            $args = @("--client", "${{ inputs.client }}")
          }
          python deploy.py @args
        env:
          MCAAS_POSTGRES_PASSWORD: ${{ secrets.MCAAS_POSTGRES_PASSWORD }}
          MCAAS_OPENSEARCH_PASSWORD: ${{ secrets.MCAAS_OPENSEARCH_PASSWORD }}
          MCAAS_REDIS_PASSWORD: ${{ secrets.MCAAS_REDIS_PASSWORD }}
          MCAAS_DJANGO_SECRET_KEY: ${{ secrets.MCAAS_DJANGO_SECRET_KEY }}

      - name: Run service health checks
        if: ${{ inputs.skip_health_check != 'true' }}
        run: ./scripts/test-services.ps1