name: Clean up deployment (Windows)

on:
  workflow_dispatch: {}

jobs:
  teardown:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          $kubeDir = "$HOME\.kube"
          if (-not (Test-Path $kubeDir)) { New-Item -Path $kubeDir -ItemType Directory | Out-Null }
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")) | Set-Content -Path "$kubeDir\config"

      - name: Teardown MCaaS stack
        run: ./scripts/teardown.ps1