name: Teardown MCaaS (Windows)

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name to tear down (loads clients/<name>/config.yaml). Leave empty for default mcaas configuration.'
        required: false
        default: ''
        type: string

jobs:
  teardown:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set up kubeconfig
        run: |
          $kubeDir = "$HOME\.kube"
          if (-not (Test-Path $kubeDir)) { New-Item -Path $kubeDir -ItemType Directory | Out-Null }
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")) | Set-Content -Path "$kubeDir\config"

      - name: Teardown MCaaS stack
        run: |
          $args = @()
          if ("${{ inputs.client }}") {
            $args = @("--client", "${{ inputs.client }}")
          }
          python teardown.py @args