name: Health Check MCaaS (Windows)

on:
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          $kubeDir = "$HOME\.kube"
          if (-not (Test-Path $kubeDir)) {
            New-Item -Path $kubeDir -ItemType Directory | Out-Null
          }
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")) | Set-Content -Path "$kubeDir\config"

      - name: Check Kubernetes cluster connectivity
        run: kubectl cluster-info