name: Health Check MCaaS (Windows)

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name (loads clients/<name>/config.yaml). Leave empty for default mcaas configuration.'
        required: false
        default: ''
        type: string

jobs:
  health-check:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set up kubeconfig
        run: |
          $kubeDir = "$HOME\.kube"
          if (-not (Test-Path $kubeDir)) {
            New-Item -Path $kubeDir -ItemType Directory | Out-Null
          }
          $kubeConfigPath = "$kubeDir\config"
          # Decode and write kubeconfig as UTF-8 WITHOUT BOM to avoid YAML parse failures.
          # PowerShell Set-Content defaults to UTF-16LE on Windows which corrupts YAML.
          $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}"))
          [System.IO.File]::WriteAllText($kubeConfigPath, $decoded, [System.Text.UTF8Encoding]::new($false))

          # Patch kubeconfig to skip TLS verification for local self-signed clusters.
          # The self-hosted runner connects to a local k3s/Rancher Desktop cluster
          # whose API server (127.0.0.1:6443) uses a self-signed certificate that
          # is not in the Windows trust store. Without this, kubectl fails with
          # "x509: certificate signed by unknown authority".
          # Replace certificate-authority-data / certificate-authority entries
          # with insecure-skip-tls-verify: true on all cluster definitions.
          $yaml = [System.IO.File]::ReadAllText($kubeConfigPath)
          $yaml = $yaml -replace '(?m)^(\s*)certificate-authority-data:.*$', '$1insecure-skip-tls-verify: true'
          $yaml = $yaml -replace '(?m)^(\s*)certificate-authority:.*$', '$1insecure-skip-tls-verify: true'
          [System.IO.File]::WriteAllText($kubeConfigPath, $yaml, [System.Text.UTF8Encoding]::new($false))

          # Verify kubectl can connect before proceeding
          kubectl cluster-info

      - name: Set configuration
        id: config
        shell: python
        run: |
          import yaml, os
          client = "${{ inputs.client }}"
          if client:
              cfg_path = f"clients/{client}/config.yaml"
              with open(cfg_path) as f:
                  cfg = yaml.safe_load(f)
              prefix = cfg["prefix"]
              ns = cfg["namespaces"]
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"prefix={prefix}\n")
                  out.write(f"ns_security_ops={ns['security-ops']}\n")
                  out.write(f"ns_managed_it={ns['managed-it']}\n")
                  out.write(f"ns_grc={ns['grc']}\n")
                  out.write(f"ns_wazuh={ns['wazuh']}\n")
                  out.write(f"client={client}\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("prefix=mcaas\n")
                  out.write("ns_security_ops=security-ops\n")
                  out.write("ns_managed_it=managed-it\n")
                  out.write("ns_grc=grc\n")
                  out.write("ns_wazuh=wazuh\n")
                  out.write("client=\n")

      - name: Check all namespaces exist
        run: |
          Write-Host "Checking required namespaces..."
          foreach ($ns in @('${{ steps.config.outputs.ns_managed_it }}', '${{ steps.config.outputs.ns_security_ops }}', '${{ steps.config.outputs.ns_grc }}', '${{ steps.config.outputs.ns_wazuh }}')) {
            if (kubectl get namespace $ns 2>$null) {
              Write-Host "✅ Namespace $ns exists"
            } else {
              Write-Host "❌ Namespace $ns not found"
              exit 1
            }
          }

      - name: Check all pods are running
        run: |
          Write-Host "Checking pod status across all MCaaS namespaces..."
          $failed = $false
          foreach ($ns in @('${{ steps.config.outputs.ns_managed_it }}', '${{ steps.config.outputs.ns_security_ops }}', '${{ steps.config.outputs.ns_grc }}', '${{ steps.config.outputs.ns_wazuh }}')) {
            Write-Host ""
            Write-Host "=== Namespace: $ns ==="
            $pods = kubectl get pods -n $ns --no-headers 2>$null
            $notRunning = $pods | Where-Object { $_ -notmatch 'Running|Completed' -and $_ -ne '' }
            if ($notRunning) {
              Write-Host "⚠️  Some pods are not running:"
              $notRunning | ForEach-Object { Write-Host $_ }
              $failed = $true
            } else {
              Write-Host "✅ All pods running"
            }
          }
          if ($failed) {
            Write-Host ""
            Write-Host "❌ Some pods are not in Running state"
            exit 1
          }

      - name: Check Helm releases
        run: |
          Write-Host "Checking Helm release status..."
          foreach ($ns in @('${{ steps.config.outputs.ns_managed_it }}', '${{ steps.config.outputs.ns_security_ops }}', '${{ steps.config.outputs.ns_grc }}')) {
            Write-Host ""
            Write-Host "=== Namespace: $ns ==="
            helm list -n $ns 2>$null
          }

      - name: Check service endpoints
        run: |
          Write-Host "Checking service endpoints..."
          $prefix = "${{ steps.config.outputs.prefix }}"
          $services = @{
            "PostgreSQL" = @("${{ steps.config.outputs.ns_managed_it }}", "$prefix-postgresql")
            "OpenSearch" = @("${{ steps.config.outputs.ns_security_ops }}", "$prefix-opensearch")
            "Wazuh Dashboard" = @("${{ steps.config.outputs.ns_wazuh }}", "wazuh-dashboard")
            "Shuffle" = @("${{ steps.config.outputs.ns_security_ops }}", "$prefix-shuffle")
            "Zammad" = @("${{ steps.config.outputs.ns_managed_it }}", "zammad-zammad-web")
            "CISO Assistant" = @("${{ steps.config.outputs.ns_grc }}", "ciso-assistant-frontend")
          }
          foreach ($svc in $services.Keys) {
            $ns = $services[$svc][0]
            $name = $services[$svc][1]
            if (kubectl get svc $name -n $ns 2>$null) {
              Write-Host "✅ $svc ($ns/$name) found"
            } else {
              Write-Host "❌ $svc ($ns/$name) not found"
            }
          }