name: Health Check MCaaS (Windows)

on:
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: self-hosted # Assuming this runner is Windows
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          $kubeDir = "$HOME\.kube"
          if (-not (Test-Path $kubeDir)) {
            New-Item -Path $kubeDir -ItemType Directory | Out-Null
          }
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")) | Set-Content -Path "$kubeDir\config"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Run service health checks
        run: ./scripts/test-services.ps1