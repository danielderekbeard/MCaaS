name: Health Check MCaaS

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name (loads clients/<name>/config.yaml). Leave empty for default mcaas configuration.'
        required: false
        default: ''
        type: string

jobs:
  health-check:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        shell: bash
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Check Kubernetes cluster connectivity
        run: kubectl cluster-info

      - name: Set configuration
        id: config
        shell: python
        run: |
          import yaml, os
          client = "${{ inputs.client }}"
          if client:
              cfg_path = f"clients/{client}/config.yaml"
              with open(cfg_path) as f:
                  cfg = yaml.safe_load(f)
              prefix = cfg["prefix"]
              ns = cfg["namespaces"]
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"prefix={prefix}\n")
                  out.write(f"ns_security_ops={ns['security-ops']}\n")
                  out.write(f"ns_managed_it={ns['managed-it']}\n")
                  out.write(f"ns_grc={ns['grc']}\n")
                  out.write(f"ns_wazuh={ns['wazuh']}\n")
                  out.write(f"client={client}\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("prefix=mcaas\n")
                  out.write("ns_security_ops=security-ops\n")
                  out.write("ns_managed_it=managed-it\n")
                  out.write("ns_grc=grc\n")
                  out.write("ns_wazuh=wazuh\n")
                  out.write("client=\n")

      - name: Check all namespaces exist
        run: |
          echo "Checking required namespaces..."
          for ns in ${{ steps.config.outputs.ns_managed_it }} ${{ steps.config.outputs.ns_security_ops }} ${{ steps.config.outputs.ns_grc }} ${{ steps.config.outputs.ns_wazuh }}; do
            if kubectl get namespace "$ns" &> /dev/null; then
              echo "✅ Namespace $ns exists"
            else
              echo "❌ Namespace $ns not found"
              exit 1
            fi
          done

      - name: Check all pods are running
        run: |
          echo "Checking pod status across all MCaaS namespaces..."
          FAILED=false
          for ns in ${{ steps.config.outputs.ns_managed_it }} ${{ steps.config.outputs.ns_security_ops }} ${{ steps.config.outputs.ns_grc }} ${{ steps.config.outputs.ns_wazuh }}; do
            echo ""
            echo "=== Namespace: $ns ==="
            NOT_RUNNING=$(kubectl get pods -n "$ns" --no-headers 2>/dev/null | grep -v "Completed" | grep -v "Running" | grep -v "^$" || true)
            if [ -n "$NOT_RUNNING" ]; then
              echo "⚠️  Some pods are not running:"
              echo "$NOT_RUNNING"
              FAILED=true
            else
              echo "✅ All pods running"
            fi
          done
          if [ "$FAILED" = true ]; then
            echo ""
            echo "❌ Some pods are not in Running state"
            exit 1
          fi

      - name: Check Helm releases
        run: |
          echo "Checking Helm release status..."
          for ns in ${{ steps.config.outputs.ns_managed_it }} ${{ steps.config.outputs.ns_security_ops }} ${{ steps.config.outputs.ns_grc }}; do
            echo ""
            echo "=== Namespace: $ns ==="
            helm list -n "$ns" 2>/dev/null || echo "No releases in $ns"
          done

      - name: Check service endpoints
        run: |
          echo "Checking service endpoints..."
          echo ""
          P="${{ steps.config.outputs.prefix }}"
          declare -A services=(
            ["PostgreSQL"]="${{ steps.config.outputs.ns_managed_it }}/${P}-postgresql:5432"
            ["OpenSearch"]="${{ steps.config.outputs.ns_security_ops }}/${P}-opensearch:9200"
            ["Wazuh Dashboard"]="${{ steps.config.outputs.ns_wazuh }}/wazuh-dashboard:443"
            ["Shuffle"]="${{ steps.config.outputs.ns_security_ops }}/${P}-shuffle:5001"
            ["Zammad"]="${{ steps.config.outputs.ns_managed_it }}/zammad-zammad-web:80"
            ["CISO Assistant"]="${{ steps.config.outputs.ns_grc }}/ciso-assistant-frontend:80"
          )
          for svc in "${!services[@]}"; do
            IFS='/' read -r ns rest <<< "${services[$svc]}"
            IFS=':' read -r svc_name port <<< "$rest"
            if kubectl get svc "$svc_name" -n "$ns" &> /dev/null; then
              echo "✅ $svc ($ns/$svc_name) found on port $port"
            else
              echo "❌ $svc ($ns/$svc_name) not found"
            fi
          done