name: Teardown MCaaS

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name to tear down (loads clients/<name>/config.yaml). Leave empty for default mcaas configuration.'
        required: false
        default: ''
        type: string

jobs:
  teardown:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Set up kubeconfig
        shell: bash
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          # Patch kubeconfig to skip TLS verification for local self-signed clusters.
          # The self-hosted runner connects to a local k3s/Rancher Desktop cluster
          # whose API server uses a self-signed certificate that is not trusted.
          # Without this, kubectl fails with "x509: certificate signed by unknown authority".
          sed -i 's/^\(\s*\)certificate-authority-data:.*$/\1insecure-skip-tls-verify: true/' $HOME/.kube/config
          sed -i 's/^\(\s*\)certificate-authority:.*$/\1insecure-skip-tls-verify: true/' $HOME/.kube/config

      - name: Teardown MCaaS stack
        run: |
          ARGS=""
          if [ -n "${{ inputs.client }}" ]; then
            ARGS="--client ${{ inputs.client }}"
          fi
          python teardown.py $ARGS