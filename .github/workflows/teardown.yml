name: Teardown MCaaS

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name to tear down (loads clients/<name>/config.yaml). Leave empty for default mcaas configuration.'
        required: false
        default: ''
        type: string

jobs:
  teardown:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Set up kubeconfig
        shell: bash
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Teardown MCaaS stack
        run: |
          ARGS=""
          if [ -n "${{ inputs.client }}" ]; then
            ARGS="--client ${{ inputs.client }}"
          fi
          python teardown.py $ARGS