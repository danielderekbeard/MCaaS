apiVersion: v1
kind: Namespace
metadata:
  name: integrations
  labels:
    name: integrations
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: zammad-credentials
  namespace: integrations
stringData:
  ZAMMAD_URL: "http://alala.mcaas.example.com"
  ZAMMAD_API_TOKEN: "REPLACE_WITH_ZAMMAD_API_TOKEN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-zammad-config
  namespace: integrations
data:
  ZAMMAD_GROUP: "SOC"
  DEDUP_WINDOW_HOURS: "24"
  LISTEN_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-zammad-connector
  namespace: integrations
  labels:
    app: wazuh-zammad-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-zammad-connector
  template:
    metadata:
      labels:
        app: wazuh-zammad-connector
    spec:
      containers:
      - name: connector
        image: python:3.11-slim
        command: ["python"]
        args: ["/app/webhook_server.py"]
        envFrom:
        - secretRef:
            name: zammad-credentials
        - configMapRef:
            name: wazuh-zammad-config
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: wazuh-zammad-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-zammad-connector
  namespace: integrations
spec:
  selector:
    app: wazuh-zammad-connector
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-zammad-scripts
  namespace: integrations
data:
  ticket_creator.py: |
    #!/usr/bin/env python3
    # [Content from ticket_creator.py - truncated for brevity]
    # Full file content should be included here
  webhook_server.py: |
    #!/usr/bin/env python3
    # [Content from webhook_server.py - truncated for brevity]
    # Full file content should be included here
